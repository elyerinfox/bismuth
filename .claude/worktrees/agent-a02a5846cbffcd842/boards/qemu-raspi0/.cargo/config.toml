# ARMv6 (ARM1176) has no stock bare-metal Rust target, so this board uses a custom target
# built with nightly build-std. Build/run with RUSTUP_TOOLCHAIN=nightly (see run.sh) — the
# stable kernel and every other board are unaffected.
[build]
target = "armv6kz-none-eabi.json"

[unstable]
json-target-spec = true
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[target.armv6kz-none-eabi]
runner = "qemu-system-arm -M raspi0 -nographic -semihosting -kernel"
rustflags = ["-C", "link-arg=-Tlink.ld"]
