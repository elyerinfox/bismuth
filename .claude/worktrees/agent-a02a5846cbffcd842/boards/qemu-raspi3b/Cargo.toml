[package]
name = "bismuth-board-qemu-raspi3b"
version = "0.1.0"
edition = "2024"
description = "Bismuth boot board for the Raspberry Pi 3 (BCM2837, Cortex-A53), QEMU raspi3b"
publish = false

[workspace]

[[bin]]
name = "bismuth-raspi3b"
path = "src/main.rs"

[dependencies]
bismuth-kernel = { path = "../..", default-features = false, features = ["edge", "fs", "power", "extensions", "posix"] }

[profile.dev]
panic = "abort"
opt-level = "s"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
