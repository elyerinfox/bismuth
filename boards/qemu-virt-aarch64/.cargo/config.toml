[build]
target = "aarch64-unknown-none-softfloat"

# Room for several concurrent EL0 user/Linux tasks (each takes a user + kernel pool stack);
# the Linux-container demo runs three at once.
[env]
BISMUTH_POOL_STACKS = "10"

[target.aarch64-unknown-none-softfloat]
runner = "qemu-system-aarch64 -M virt -cpu cortex-a53 -nographic -semihosting -kernel"
rustflags = ["-C", "link-arg=-Tlink.ld"]
