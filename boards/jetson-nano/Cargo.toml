[package]
name = "bismuth-board-jetson-nano"
version = "0.1.0"
edition = "2024"
description = "Bismuth boot board for the NVIDIA Jetson Nano (Tegra X1, Cortex-A57); build-verified, runtime on real hardware (no QEMU machine)"
publish = false

[workspace]

[[bin]]
name = "bismuth-jetson-nano"
path = "src/main.rs"

[dependencies]
bismuth-kernel = { path = "../..", default-features = false, features = ["edge", "fs", "power", "extensions", "posix"] }

[profile.dev]
panic = "abort"
opt-level = "s"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
