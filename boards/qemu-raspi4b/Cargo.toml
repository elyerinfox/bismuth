[package]
name = "bismuth-board-qemu-raspi4b"
version = "0.1.0"
edition = "2024"
description = "Bismuth boot board for the Raspberry Pi 4 (BCM2711, Cortex-A72), QEMU raspi4b"
publish = false

[workspace]

[[bin]]
name = "bismuth-raspi4b"
path = "src/main.rs"

[dependencies]
bismuth-kernel = { path = "../..", default-features = false, features = ["edge", "fs", "power", "extensions", "posix"] }

[profile.dev]
panic = "abort"
opt-level = "s"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
